# This is a Declarative Automation Bundle definition for bundle_test_2.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bundle_test_2
  uuid: c254dee9-cf64-4d22-9000-91d56af2013f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-da915ee9-f956.cloud.databricks.com
    variables:
      catalog: dbacademy
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-da915ee9-f956.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/prakash.baskar@happiestminds.com to make sure we only have a single copy.
      root_path: /Workspace/Users/prakash.baskar@happiestminds.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbacademy
      schema: prod
    permissions:
      - user_name: prakash.baskar@happiestminds.com
        level: CAN_MANAGE
